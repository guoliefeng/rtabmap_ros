# Mode B with translation-only, position-only INS priors. FAST-LIO remains the
# sole odometry estimator and RTAB-Map IMU input remains disabled.
subscribe_depth: false
subscribe_rgb: false
subscribe_rgbd: false
subscribe_stereo: false
subscribe_scan: false
subscribe_scan_cloud: true
subscribe_scan_descriptor: false
subscribe_odom: true
subscribe_odom_info: false

publish_tf: true
approx_sync: false
topic_queue_size: 30
sync_queue_size: 100
wait_for_transform_duration: 0.2

Mem/IncrementalMemory: true
Mem/InitWMWithAllNodes: false
Mem/BinDataKept: true
Mem/ReduceGraph: false

Reg/Strategy: 1
Reg/Force3DoF: false

# Pose Prior links are ignored by default. GTSAM supports position-only 3D
# priors with covariance; angular covariance >=9999 leaves attitude free.
Optimizer/Strategy: 2
Optimizer/PriorsIgnored: false
Optimizer/VarianceIgnored: false
Optimizer/Iterations: 30
Optimizer/GravitySigma: 0.0

Rtabmap/DetectionRate: 2.0
Rtabmap/TimeThr: 0
Rtabmap/MemoryThr: 0

RGBD/LinearUpdate: 0.50
RGBD/AngularUpdate: 0.087266
RGBD/ProximityBySpace: true
RGBD/ProximityByTime: false
RGBD/ProximityPathMaxNeighbors: 1
RGBD/OptimizeFromGraphEnd: false

Grid/Sensor: 0
Grid/RangeMin: 2.0
Grid/RangeMax: 100.0
Grid/CellSize: 0.20

Icp/PointToPlane: true
Icp/PointToPlaneK: 0
Icp/PointToPlaneRadius: 0.50
Icp/Iterations: 30
Icp/MaxCorrespondenceDistance: 2.0
Icp/CorrespondenceRatio: 0.10
Icp/VoxelSize: 0.0
