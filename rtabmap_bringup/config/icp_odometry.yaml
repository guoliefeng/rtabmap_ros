# ROS/private parameters for rtabmap_odom/icp_odometry.
# The input cloud is already preprocessed and expressed in base_link.
frame_id: base_link
odom_frame_id: odom_rtabmap
publish_tf: true
wait_imu_to_init: true
wait_for_transform: true
wait_for_transform_duration: 0.2

queue_size: 100
expected_update_rate: 10.0
max_update_rate: 0.0

scan_cloud_max_points: 0
scan_cloud_is_2d: false
scan_downsampling_step: 1
scan_range_min: 2.0
scan_range_max: 100.0
scan_voxel_size: 0.20
scan_normal_k: 20
scan_normal_radius: 0.0
scan_normal_ground_up: 0.0

# The bag cloud has no per-point time/ring fields and is already preprocessed.
deskewing: false
deskewing_slerp: false

Reg/Strategy: 1
Reg/Force3DoF: false

Odom/Strategy: 0
Odom/GuessMotion: true
Odom/ResetCountdown: 1
Odom/FillInfoData: true

Icp/PointToPlane: true
Icp/Iterations: 30
Icp/MaxCorrespondenceDistance: 1.0
Icp/CorrespondenceRatio: 0.10
Icp/Epsilon: 0.0001
Icp/VoxelSize: 0.0
Icp/PointToPlaneK: 0
